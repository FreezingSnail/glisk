[package]
name = "glisk-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
base64 = "0.22.1"
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["svg", "system-fonts", "woff", "text-transform-icu"] }
blitz-html = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
libc = "0.2"
anyrender_vello_cpu = "=0.18.0"
vello_cpu = { version = "0.3.0", default-features = false, features = ["std", "png"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
